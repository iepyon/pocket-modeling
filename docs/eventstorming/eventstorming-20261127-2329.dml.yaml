  goal: 小売店舗で在庫を抱えすぎる（売れ残り・期限切れ）原因を、発注から商品が店を出ていくまでの流れの中で明らかにする
questions:
  - id: Q1
    topic: 小売店舗での「出荷」は何を指すか
    why: スコープは「発注から出荷まで」と決まったが、店舗では商品の出口が店頭販売・他店への移動・仕入先への返品・廃棄と複数ある。どこを終点にするかで、扱う出来事の範囲が変わる。
    status: open
    note: '仮置き: 商品が店を出ていくことすべて（販売・移動・返品・廃棄）を終点として扱う。'
  - id: Q2
    topic: 売れ残りに気づくのが「期限や季節の終わりが近づいたとき」では遅すぎないか
    why: 気づくきっかけが期限間際だと、返品できる期限を過ぎていたり、値下げしても売り切れなかったりする。もっと早く気づく手段（売れ行きの数字など）が無いこと自体が、抱えすぎの原因かもしれない。
    status: open
narratives:
  - id: happy
    kind: happy
    title: ハッピーパス — 発注から売り切りまで
    prose: "店長や売場の担当者は、売場とバックヤードを見て回り、これまでの経験から「この商品はこのくらい要る」と数を決めて仕入先に発注する。\n数日後、商品が店に届く。担当者は届いた商品を受け取り、数を確かめてバックヤードに置く。\n\n売場の棚が減ってきたら、バックヤードから商品を出して並べる。お客さんが買っていくたびに在庫は減り、\n賞味期限や季節の終わりが来る前に、仕入れた分をほぼ売り切る。\n\n棚が空きそうになったら、店長や担当者はまた売場を見て、次の発注の数を決める。\n"
  - id: alt-return-to-supplier
    kind: alt
    title: 代替シナリオ — 売れ残りに気づいて仕入先へ返品する
    prose: "経験で決めた数が多すぎて、商品が思ったほど売れない。賞味期限や季節の終わりが近づいて初めて、担当者は売れ残りそうだと気づく。\nまず仕入先に返品を申し出て、受け付けてもらえた分を送り返す。\n"
  - id: alt-return-refused
    kind: alt
    title: 代替シナリオ — 返品できずに店に残る
    prose: "売れ残りに気づいて返品を申し出たが、仕入先に受け付けてもらえない。商品は店に残り、別の出口を探すことになる。\nどんな場合に返品できないのか、残った商品が最後にどうなるのかは確認中。\n"
