session:
  id: eventstorming-20261128-1105
  domain: コーヒーショップ（焙煎・豆販売あり／AIエージェント前提の再デザイン）
  phase: '7'
  status: Phase 7 完了。未確認事項なし。次のアクションA2・A3（全数試飲の計画、支払い・配送サービスの選定）
  goal: フィジカルAI（ロボット）と店のAIエージェント、キャラの立ったマスターが切り盛りする、豆にこだわる店の業務をAIエージェント前提で設計し直す
  started_at: '2026-11-28'
  html_link: ../../dist/eventstorming/eventstorming-20261128-1105.html
narratives:
  - id: happy
    kind: happy
    title: ハッピーパス — 生豆の選定から一杯の提供まで
    prose: マスターが自分の舌と目で生豆を選び、店のAIエージェントが発注して、届いた生豆を伝票と照合して在庫に加える。生豆はフィジカルAI（焙煎ロボット）が焙煎し、測定で基準内なら焙煎豆として店に並ぶ。客のアプリやAIが来店して注文し、自動で支払う。注文を受けたロボットが接客して好みに合う豆を提案し、ドリンクを淹れて客に提供する。
    entry: マスターが生豆を選んで仕入れる
  - id: alt-roast-miss
    kind: alt
    title: 代替 — 焙煎が狙いどおりにならない
    prose: 測定結果が基準外の豆は、マスターが試飲して合否を判定する。不合格の豆は廃棄する（焙煎し直しや別用途には回さない）。実績がたまるまでは、測定結果にかかわらず、すべての焙煎豆をマスターが試飲する。
    entry: 焙煎ロボットが焙煎結果を測定して判定する
  - id: alt-bean-shortage
    kind: alt
    title: 代替 — 豆が足りない・傷んでいる
    prose: 客が注文した豆の在庫がない、または鮮度が落ちている。ロボットが客に事情を伝えて代わりの豆を提案する。補充は、マスターが選んだことのある豆なら店のAIが自動で発注する。
    entry: 接客ロボットが在庫切れの注文に代わりの豆を提案する
  - id: alt-system-down
    kind: alt
    title: 代替 — ロボットが止まる
    prose: 焙煎ロボットや接客ロボットが故障や通信断で止まる。店のAIが停止を検知し、客に状況を伝えて代わりの対応を案内する。マスターが手動に切り替える手順は未確認。
    entry: 店のAIエージェントが機器の停止を検知する
  - id: alt-receiving-mismatch
    kind: alt
    title: 代替 — 届いた生豆が伝票と合わない
    entry: 店のAIエージェントが届いた生豆を伝票と照合して在庫に加える
    prose: 届いた生豆の数量や状態が伝票と合わない。店のAIエージェントは在庫に加えず、仕入れ先に自動で問い合わせる。
  - id: alt-payment-failure
    kind: alt
    title: 代替 — 支払いに失敗する
    entry: 客のアプリやAIが自動で支払う
    prose: 客のアプリやAIの支払いが失敗する。接客ロボットが客に声をかけて別の支払い方法を案内する。支払えないまま客が離れたら、一定時間で注文を取り消す。
  - id: alt-retail
    kind: alt
    title: 代替 — 焙煎した豆を量り売り・袋売りで買う
    entry: 客が焙煎した豆を量り売り・袋売りで買う
    prose: 客が焙煎した豆を買う。詰めロボットが量って詰め、焙煎日のラベルを付ける。マスターが手書きのメッセージを添える（忙しいときは省略）。
  - id: alt-subscription
    kind: alt
    title: 代替 — 豆の定期便
    entry: 客が豆の定期便を申し込む
    prose: 客が豆の定期便を申し込む。マスターが毎月の豆を選び、詰めロボットが詰め、マスターが手書きのメッセージを添える。発送は外部の配送業者が行う。客は次の発送前なら、休止や解約ができる。
scenarios:
  - name: マスターが生豆を選んで仕入れる
    ctx: sourcing
    actor: Master
    cmd: SelectGreenBeans
    evt: GreenBeansSelected
    next: 店のAIエージェントが生豆を発注する
  - name: 焙煎ロボットが生豆を焙煎する
    ctx: roasting
    actor: RoastingRobot
    cmd: RoastBeans
    evt: BeansRoasted
    next: 焙煎ロボットが焙煎結果を測定して判定する
    agg: RoastBatch
    rules:
      - rule: NoNewRoastInstructionWhileRoasting
        why: 焙煎中に重ねて指示すると、同じ豆が余って鮮度を損なうため
    errs:
      - cond: 焙煎に使える生豆の在庫がない
        err: NoGreenBeansInStock
        when: 焙煎の指示時
  - name: 焙煎ロボットが焙煎結果を測定して判定する
    ctx: roasting
    actor: RoastingRobot
    cmd: MeasureRoast
    brMode: exclusive
    brs:
      - cond: 測定値が基準内
        evt: RoastApproved
      - cond: 測定値が基準外
        evt: RoastFlaggedForTasting
    next:
      happy: 客が来店して接客ロボットに注文する
      alt-roast-miss: マスターが基準外の豆を試飲して判定する
    rules:
      - rule: RoastedBatchesAreJudgedAgainstCriteriaBuiltFromApprovedBatches
        why: 豆ごとの微妙な違いまで合否に反映し、マスターの舌で積み上げた合格の実績を無駄にしないため
      - rule: AllRoastsAreTastedByMasterUntilMasterSwitchesToAutomatedCriteria
        why: 基準の元になる合格の実績を、マスターの舌で確実に積み上げるため
    agg: RoastBatch
    note: 全数試飲の期間中は、測定が基準内でも試飲待ちにする（D27）。マスターが切り替えるまで続く（D28）
  - name: マスターが基準外の豆を試飲して判定する
    ctx: roasting
    actor: Master
    cmd: TasteFlaggedRoast
    brMode: exclusive
    brs:
      - cond: マスターが合格と判断
        evt: RoastApprovedByMaster
        terminal: alt-roast-miss
      - cond: マスターが不合格と判断
        evt: RoastRejected
    next: マスターが不合格の豆を廃棄する
    note: 実績がたまるまでは、測定の結果にかかわらずすべての焙煎豆をマスターが試飲する（D27）。実績がたまったあとは基準外の豆だけ（D1）
    agg: RoastBatch
  - name: 客が来店して接客ロボットに注文する
    ctx: ordering
    actor: Customer
    cmd: PlaceOrder
    evt: OrderPlaced
    next: 客のアプリやAIが自動で支払う
    agg: Order
  - name: 客が焙煎した豆を量り売り・袋売りで買う
    ctx: retail
    actor: Customer
    cmd: PurchaseBeans
    evt: BeansPurchased
    next: 詰めロボットが量り売りの豆を量って詰める
  - name: 客が豆の定期便を申し込む
    ctx: subscription
    actor: Customer
    cmd: SubscribeBeans
    evt: SubscriptionStarted
    agg: Subscription
    next: マスターが定期便の豆を毎月選ぶ
  - name: 店のAIエージェントが生豆を発注する
    ctx: sourcing
    actor: ShopAgent
    cmd: PlaceGreenBeansOrder
    evt: GreenBeansOrdered
    pivotal: true
    next: 店のAIエージェントが届いた生豆を伝票と照合して在庫に加える
    agg: GreenBeansLot
    rules:
      - rule: AutoReorderTargetsOnlyBeansTheMasterHasChosenBefore
        why: マスターが選んでいない豆を機械が勝手に仕入れると、豆へのこだわりが崩れるため
      - rule: NoReorderWhileLotIsOrdered
        why: 発注済みの入荷が届くまで再発注すると、同じ豆が余って鮮度を損なうため
    errs:
      - cond: マスターが選んだことのない豆を自動で補充しようとした
        err: BeanNotChosenByMaster
        when: 自動補充の発注時
      - cond: 発注済みの入荷が届く前に再発注しようとした
        err: GreenBeansAlreadyOrdered
        when: 自動補充の発注時
  - name: マスターが不合格の豆を廃棄する
    ctx: roasting
    actor: Master
    cmd: DiscardRoast
    evt: RoastDiscarded
    agg: RoastBatch
  - name: 接客ロボットが客の許可を取って好みを記録する
    ctx: ordering
    actor: ReceptionRobot
    cmd: RecordPreference
    evt: PreferenceRecorded
    rules:
      - rule: PreferenceIsRecordedOnlyWithCustomerConsent
        why: 客が安心して好みを預けられる信頼を守るため。許可のない記録は、店への信頼を損なう
    agg: CustomerPreference
  - name: マスターが定期便の豆を毎月選ぶ
    ctx: subscription
    actor: Master
    cmd: SelectMonthlyBeans
    evt: MonthlyBeansSelected
    agg: Subscription
    next: 詰めロボットが定期便の豆を詰める
  - name: 客のアプリやAIが自動で支払う
    ctx: ordering
    actor: CustomerAgent
    cmd: Pay
    pivotal: true
    brMode: exclusive
    brs:
      - cond: 支払いに成功
        evt: PaymentCompleted
        terminal: alt-payment-failure
      - cond: 支払いに失敗
        evt: PaymentFailed
        pol:
          - GuideAlternativePaymentOnFailure
    agg: Order
    next:
      happy: ドリンクロボットが注文のドリンクを淹れる
      alt-payment-failure: 接客ロボットが支払いに失敗した客に別の支払い方法を案内する
  - name: 接客ロボットが在庫切れの注文に代わりの豆を提案する
    ctx: ordering
    actor: ReceptionRobot
    cmd: ProposeAlternativeBeans
    evt: AlternativeBeansProposed
    qry:
      - FreshRoastedBeansForSale
  - name: 店のAIエージェントが機器の停止を検知する
    ctx: operations
    actor: ShopAgent
    cmd: DetectOutage
    evt: OutageDetected
    next: マスターが停止に気づいて手動運転に切り替える
    pol:
      - NotifyCustomerOnOutage
  - name: 店のAIエージェントが届いた生豆を伝票と照合して在庫に加える
    ctx: sourcing
    actor: ShopAgent
    cmd: ReceiveGreenBeans
    agg: GreenBeansLot
    brMode: exclusive
    brs:
      - cond: 伝票と一致
        evt: GreenBeansReceived
        terminal: alt-receiving-mismatch
      - cond: 伝票と不一致
        evt: DiscrepancyDetected
        pol:
          - InquireSupplierOnDiscrepancy
    next:
      happy: 店のAIエージェントが焙煎済み在庫の減少を検知する
      alt-receiving-mismatch: 店のAIエージェントが伝票と合わない生豆を仕入れ先に問い合わせる
    rules:
      - rule: MismatchedLotIsNotAddedToStock
        why: 伝票と合わない入荷を在庫に加えると、在庫の量と請求がずれて、焙煎や補充の判断を誤るため
    errs:
      - cond: 伝票と数量や状態が合わない入荷
        err: GreenBeansDiscrepancy
        when: 入荷の照合時
  - name: 店のAIエージェントが焙煎済み在庫の減少を検知する
    ctx: roasting
    actor: ShopAgent
    cmd: CheckRoastedStock
    evt: RoastedStockLow
    qry:
      - RoastedStockLevel
    next: 焙煎ロボットが生豆を焙煎する
    pol:
      - AutoInstructRoastingOnLowStock
  - name: 詰めロボットが定期便の豆を詰める
    ctx: subscription
    actor: PackingRobot
    cmd: PackSubscriptionBeans
    evt: SubscriptionBeansPacked
    rules:
      - rule: RoastedBeansAreShippedWithin3DaysOfRoasting
        why: 鮮度にこだわる店なので、焙煎から3日を過ぎた焙煎豆は発送しない。配送にかかる日数は数えない
    errs:
      - cond: 発送時点で焙煎から3日を過ぎた豆を詰めようとした
        err: RoastedBeansExpired
        when: 詰める前の期限確認
    next: 定期便の詰めた豆に手書きのメッセージを添える
    note: 詰めるときにロボットが焙煎日のラベルを付ける（D34）。焙煎ロット番号は袋のラベルや記録で結び付ける
    agg: Subscription
    qry:
      - FreshRoastedBeansForSale
  - name: 外部の配送業者が定期便を客に届ける
    ctx: subscription
    actor: DeliveryCarrier
    cmd: DeliverSubscriptionBeans
    evt: SubscriptionBeansDelivered
    agg: Subscription
  - name: 店のAIエージェントが伝票と合わない生豆を仕入れ先に問い合わせる
    ctx: sourcing
    actor: ShopAgent
    cmd: InquireSupplierDiscrepancy
    evt: SupplierInquirySent
    note: 受け入れ scenario の分岐（伝票と一致／不一致）としてフェーズ4で繋ぎ直す
    agg: GreenBeansLot
  - name: マスターが豆ごとの在庫の目安を決める
    ctx: roasting
    actor: Master
    cmd: DefineRestockLevel
    evt: StockThresholdSet
    note: 対象は焙煎済み在庫と生豆の在庫の両方の補充の目安（D39）
  - name: ドリンクロボットが注文のドリンクを淹れる
    ctx: ordering
    actor: DrinkRobot
    cmd: BrewDrink
    evt: DrinkBrewed
    next: ドリンクに最後の一手を加えて仕上げる
    agg: Order
  - name: 詰めロボットが量り売りの豆を量って詰める
    ctx: retail
    actor: PackingRobot
    cmd: WeighAndPackBeans
    evt: BeansPacked
    next: 袋詰めした豆に手書きのメッセージを添える
    rules:
      - rule: RoastedBeansAreHandedToCustomersWithin3DaysOfRoasting
        why: 鮮度にこだわる店なので、焙煎から3日を過ぎた焙煎豆は客に渡さない
    errs:
      - cond: 焙煎から3日を過ぎた豆を詰めようとした
        err: RoastedBeansExpired
        when: 詰める前の期限確認
    note: 詰めるときにロボットが焙煎日のラベルを付ける（D34）。焙煎ロット番号は袋のラベルや記録で結び付ける
    qry:
      - FreshRoastedBeansForSale
  - name: 店のAIエージェントが生豆の在庫減少を検知する
    ctx: sourcing
    actor: ShopAgent
    cmd: CheckGreenBeansStock
    evt: GreenBeansStockLow
    qry:
      - GreenBeansStockLevel
  - name: 接客ロボットが支払いに失敗した客に別の支払い方法を案内する
    ctx: ordering
    actor: ReceptionRobot
    cmd: GuideAlternativePayment
    evt: AlternativePaymentGuided
    agg: Order
    next: 店のAIエージェントが支払いを放棄された注文を取り消す
    note: 別の方法で支払えた場合は Pay に戻る（PAYMENT_FAILED→PAID）。図には出さない
  - name: 店のAIエージェントが停止を客に伝えて代わりの対応を案内する
    ctx: operations
    actor: ShopAgent
    cmd: NotifyCustomerOfOutage
    evt: CustomerNotifiedOfOutage
  - name: 袋詰めした豆に手書きのメッセージを添える
    ctx: retail
    actor: Master
    cmd: WriteHandwrittenMessage
    evt: HandwrittenMessageWritten
    note: 手職人の温かみが残る場面。担い手はマスター本人（D23）
    rules:
      - rule: FinalTouchMayBeOmittedWhenMasterIsBusy
        why: マスターが忙しいときは、客を待たせないために最後の一手を省略してよいと決めたため。焙煎日はロボットのラベルで付くので、省略しても焙煎日は残る
  - name: ドリンクに最後の一手を加えて仕上げる
    ctx: ordering
    actor: Master
    cmd: FinishDrink
    evt: DrinkFinished
    note: 手職人の温かみが残る場面。ラテアートや仕上げの声かけ。担い手はマスター本人（D23）
    rules:
      - rule: FinalTouchMayBeOmittedWhenMasterIsBusy
        why: マスターが忙しいときは、客を待たせないために最後の一手を省略してよいと決めたため
    agg: Order
  - name: 定期便の詰めた豆に手書きのメッセージを添える
    ctx: subscription
    actor: Master
    cmd: WriteSubscriptionMessage
    evt: SubscriptionMessageWritten
    note: 手職人の温かみが残る場面。担い手はマスター本人（D23）。量り売り・袋売りと定期便の両方に付ける（D26）
    rules:
      - rule: FinalTouchMayBeOmittedWhenMasterIsBusy
        why: マスターが忙しいときは、客を待たせないために最後の一手を省略してよいと決めたため。焙煎日はロボットのラベルで付くので、省略しても焙煎日は残る
    agg: Subscription
    next: 外部の配送業者が定期便を客に届ける
  - name: マスターが全数試飲をやめて店のAIの基準に切り替える
    ctx: roasting
    actor: Master
    cmd: ActivateAutomatedCriteria
    evt: AutomatedCriteriaActivated
    note: 実績がたまったかどうかはマスターが「もう大丈夫」と判断する（D28）
  - name: マスターが停止に気づいて手動運転に切り替える
    ctx: operations
    actor: Master
    cmd: SwitchToManualOperation
    evt: ManualOperationStarted
    note: 通知はなく、マスターが目で見て気づく（D30）
    next: マスターが復旧を確認して自動運転に戻す
  - name: 客が定期便を休止する
    ctx: subscription
    actor: Customer
    cmd: PauseSubscription
    evt: SubscriptionPaused
    agg: Subscription
    errs:
      - cond: 今月の発送の詰めを始めたあとに休止を申し出た
        err: SubscriptionShipmentAlreadyStarted
        when: 今月の発送の詰めを始めたあと
  - name: 客が定期便を再開する
    ctx: subscription
    actor: Customer
    cmd: ResumeSubscription
    evt: SubscriptionResumed
    agg: Subscription
  - name: 客が定期便をやめる
    ctx: subscription
    actor: Customer
    cmd: CancelSubscription
    evt: SubscriptionCancelled
    agg: Subscription
    errs:
      - cond: 次の発送を始めたあとに解約を申し出た
        err: SubscriptionShipmentAlreadyStarted
        when: 次の発送の詰めを始めたあと
  - name: 客が淹れ始める前に注文を取り消す
    ctx: ordering
    actor: Customer
    cmd: CancelOrder
    evt: OrderCancelled
    agg: Order
    errs:
      - cond: ドリンクを淹れ始めたあとに取り消そうとした
        err: OrderAlreadyBrewing
        when: 淹れ始めたあと
  - name: 接客ロボットが客の求めに応じて好みの記録を削除する
    ctx: ordering
    actor: ReceptionRobot
    cmd: EraseCustomerPreference
    evt: CustomerPreferenceErased
    agg: CustomerPreference
    rules:
      - rule: PreferenceIsErasedImmediatelyWhenConsentIsWithdrawn
        why: 客の許可を取って記録すると決めたため、許可が取り消されたらすぐ削除する
  - name: 店のAIエージェントが支払いを放棄された注文を取り消す
    ctx: ordering
    actor: ShopAgent
    cmd: CancelAbandonedOrder
    evt: AbandonedOrderCancelled
    agg: Order
    note: 支払いに失敗したまま客が離れて10分が過ぎたとき（D40）
  - name: マスターが復旧を確認して自動運転に戻す
    ctx: operations
    actor: Master
    cmd: RestoreAutomaticOperation
    evt: AutomaticOperationRestored
questions:
  - id: Q1
    topic: 持ち帰りドリンクも扱うか
    why: 商品の質問で持ち帰りドリンクは選ばれなかったため、扱わない前提で暫定。必要なら再検討
    status: closed
    decision_id: D31
  - id: Q2
    topic: 停止を検知した後にマスターへ切り替える手順
    why: 停止の発見は店のAIが監視すると決まったが、検知後に誰へ何を伝え手動運転へ移るかは未確認
    status: closed
    note: 客への案内はD17で決定。マスターへの通知と手動運転への切り替え手順は未確認のまま
    decision_id: D30
  - id: Q3
    topic: 自動補充発注の対象と上限
    why: D3は発注のたびにマスターが豆を選ぶ前提だが、D15で在庫減少時は自動発注になった。マスターが選んだことのある豆だけか、金額や量の上限があるかが未確認
    status: closed
    decision_id: D15
  - id: Q4
    topic: バーチャル接客を削る場合、接客を誰が担うか
    why: q-22の自由記述に「バーチャル接客は削って」とあった。キャラが接客する前提で決めたD4・D7・D16と、ordering BCのシナリオ多数に影響するため、確認するまでモデルは変更しない
    status: closed
    decision_id: D19
  - id: Q5
    topic: 手書きメッセージやドリンクの最後の一手を誰が行うか
    why: 温かみが残る場面として「袋詰めや手書きのメッセージ」「ドリンクの最後の一手」が挙がったが、マスター本人が行うのか、ロボットが手職人の所作を再現するのかが未確認。D13・D14（ロボットが淹れる・詰める）との関係にも影響
    status: closed
    decision_id: D23
  - id: Q6
    topic: 焙煎した豆を渡してよい期限の具体的な日数
    why: D24で「焙煎から数日以内と一律に決める」としたが、何日以内かが未確認。ルールの日数はモデルに書けていない
    status: closed
    decision_id: D24
  - id: Q7
    topic: 合格の実績がない最初の基準の置き方
    why: D25で基準は過去の合格データから店のAIが決めるとしたが、開店直後や新しい豆は実績がない。その間の基準を誰がどう置くかが未確認
    status: closed
    decision_id: D27
  - id: Q8
    topic: 定期便の期限3日が発送までか届くまでか
    why: D24で焙煎から3日以内と決めたが、定期便は配送に日数がかかる。3日が発送までか客の手元に届くまでかが未確認
    status: closed
    decision_id: D24
  - id: Q9
    topic: 実績がたまったと見なして試飲を外す条件
    why: D27で実績がたまるまで全部マスターが試飲するとしたが、どれだけたまったら店のAIの基準に切り替えるかが未確認
    status: closed
    decision_id: D28
  - id: Q10
    topic: 忙しくてメッセージを省略するときの焙煎日の記入
    why: D29では忙しいとき手書きメッセージを省略してよいが、D34では焙煎日を手書きメッセージとあわせて書く。省略すると焙煎日の記入も消え、焙煎から3日以内を客が確かめる手がかりがなくなる
    status: closed
    decision_id: D34
  - id: Q11
    topic: 支払いに失敗したまま客が離れたとき、放棄とみなす時間
    why: 支払いに失敗した注文は一定時間で取り消すとしたが、何分で放棄とみなすかが未確認
    status: closed
    decision_id: D40
decisions:
  - id: D1
    topic: 焙煎した豆の合否判定を誰がするか
    chosen: robot-measure-master-taste-on-fail
    options:
      - name: master-always
        label: 毎回マスターが試飲
        why_not: 毎回の試飲は量が増えるとマスターの手が回らない
      - name: robot-measure-master-taste-on-fail
        label: ロボットが測り基準外のときだけマスターが試飲
        adopted: true
        why: 普段はロボットの測定で回し判断が分かれる豆だけマスターの舌に任せられる
      - name: robot-only
        label: ロボットの測定だけで合格
        why_not: 豆にこだわる店で人間の舌を通さずに並べるのは避けたい
    affects:
      - roasting
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認。実績がたまるまでは全数試飲（D27）で、この決定は切り替え（D28）後の運用
  - id: D2
    topic: 試飲で不合格だった豆の扱い
    chosen: discard
    options:
      - name: discard
        label: 廃棄する
        adopted: true
        why: こだわりの基準に届かない豆は店に出さない
      - name: re-roast
        label: 焙煎し直す
        why_not: 一度外れた豆は狙いの味に戻らない
      - name: repurpose
        label: 別の用途に回す
        why_not: 品質の線引きが曖昧になる
    affects:
      - roasting
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D3
    topic: 生豆の発注を誰が実行するか
    chosen: agent-orders-master-selects
    options:
      - name: agent-orders-master-selects
        label: 店のAIエージェントが発注しマスターは選ぶだけ
        adopted: true
        why: マスターは豆を見極めることに専念し発注の手間をAIに任せる
      - name: master-orders
        label: マスターが自分で発注する
        why_not: 発注の手間でマスターの時間が取られる
      - name: ai-proposes-master-approves
        label: AIが案を作りマスターが承認して発注する
        why_not: 選ぶ判断と承認が二重になる
    affects:
      - sourcing
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D4
    topic: 常連客の好みの記憶
    chosen: remember-with-consent
    options:
      - name: remember-with-consent
        label: 客の許可を取ったうえで記録する
        adopted: true
        why: 客が安心して好みを預けられる
      - name: remember-auto
        label: 来店したら自動で記録する
        why_not: 客の知らないうちに記録するのは信頼を損なう
      - name: no-memory
        label: 覚えない
        why_not: 好みに合う提案ができなくなる
    affects:
      - ordering
      - CustomerPreference
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D5
    topic: 定期便の今月の豆を誰が決めるか
    chosen: master-picks-monthly
    options:
      - name: master-picks-monthly
        label: マスターが毎月選ぶ
        adopted: true
        why: 豆にこだわる店の顔としてマスターの選定を売りにできる
      - name: ai-picks
        label: 店のAIが客の好みから選ぶ
        why_not: 豆へのこだわりがマスターの選定から離れる
      - name: customer-picks
        label: 客が選ぶ
        why_not: 選ぶ手間が客に残る
    affects:
      - subscription
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D6
    topic: 客からの支払いを誰が行うか
    chosen: customer-agent-auto-pays
    options:
      - name: customer-agent-auto-pays
        label: 客のアプリやAIが自動で支払う
        adopted: true
        why: AIエージェント前提の店で客を待たせず注文から支払いまで完了できる
      - name: prepay-at-robot
        label: 接客ロボットが注文とあわせて受け取る
        why_not: 客の側にも代理AIがいる前提とずれる
      - name: pay-on-handoff
        label: ドリンクを渡すときに受け取る
        why_not: 渡す場面に支払いの手間が入る
    affects:
      - ordering
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D7
    topic: 在庫切れ時の接客ロボットの対応
    chosen: propose-alternative
    options:
      - name: propose-alternative
        label: 代わりの豆を提案する
        adopted: true
        why: 客の来店を無駄にせず好みに近い豆を勧められる
      - name: wait-for-restock
        label: 入荷を待つよう案内し予約を受ける
        why_not: その場の注文が取れない
      - name: call-master
        label: マスターを呼ぶ
        why_not: マスターの手が止まり接客が詰まる
    affects:
      - ordering
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D8
    topic: 届いた生豆の受け入れを誰が行うか
    chosen: agent-reconciles-and-stocks
    options:
      - name: agent-reconciles-and-stocks
        label: 店のAIが伝票と照合して自動で在庫に加える
        adopted: true
        why: 受け入れの手間をAIに任せ、マスターは豆の見極めに専念できる
      - name: master-inspects
        label: マスターが目で見て確かめる
        why_not: 入荷のたびにマスターの手が止まる
      - name: robot-sensor
        label: 焙煎ロボットがセンサーで確かめる
        why_not: 伝票との照合はロボットの役割から外れる
    affects:
      - sourcing
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D9
    topic: 焙煎の開始を誰が決めるか
    chosen: agent-instructs-roasting-on-low-stock
    options:
      - name: agent-instructs-roasting-on-low-stock
        label: 店のAIが在庫量を見て自動で焙煎を指示する
        adopted: true
        why: 在庫切れを防ぎ、マスターの判断を待たずに焙煎を回せる
      - name: master-approves
        label: AIが提案しマスターが承認してから始める
        why_not: 承認待ちの間に在庫が切れ、焙煎が止まる恐れがある
      - name: master-decides
        label: マスターが自分で決めて指示する
        why_not: 在庫の見張りと指示を人が続けることになり、見落とすとそのまま在庫切れになる
    affects:
      - roasting
      - RoastBatch
      - AutoInstructRoastingOnLowStock
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D10
    topic: 定期便の詰めと発送を誰が行うか
    chosen: robot-packs-carrier-delivers
    options:
      - name: robot-packs-carrier-delivers
        label: ロボットが詰め、発送は外部の配送業者
        adopted: true
        why: 詰める作業は店内のロボットで回し、客の手元まで運ぶ部分は専門の業者に任せられる
      - name: master-packs-and-ships
        label: マスターが詰めて発送する
        why_not: 定期便の件数が増えるとマスターの手が足りなくなる
      - name: all-outsourced
        label: 詰めも発送も外部に任せる
        why_not: 豆にこだわる店が最後の仕上げを手放すことになる
    affects:
      - subscription
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D11
    topic: 伝票と合わない生豆の扱い
    chosen: agent-inquires-supplier
    options:
      - name: agent-inquires-supplier
        label: 店のAIが仕入れ先に自動で問い合わせる
        adopted: true
        why: 不一致に気づいたその場で動け、マスターの手を止めずに済む
      - name: master-decides
        label: マスターが状態を見て受け取るか決める
        why_not: 入荷のたびにマスターの判断待ちになる
      - name: stock-matching-part
        label: 合わない分を除いて在庫に加え後で精算する
        why_not: 精算が後回しになり在庫と請求がずれる
    affects:
      - sourcing
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D12
    topic: 在庫が減ったと判断する目安の決め手
    chosen: master-sets-per-bean
    options:
      - name: master-sets-per-bean
        label: マスターが豆ごとに決める
        adopted: true
        why: 豆ごとに売れ方や鮮度の保ち方が違い、豆に詳しいマスターが一番よく分かる
      - name: ai-decides-from-sales
        label: AIが売れ行きから自動で決める
        why_not: 豆へのこだわりをマスターが手放すことになる
      - name: uniform-threshold
        label: 一律の目安をマスターが決める
        why_not: 豆ごとの違いを反映できない
    affects:
      - roasting
      - sourcing
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D13
    topic: ドリンクを淹れる担当
    chosen: robot-brews
    options:
      - name: robot-brews
        label: フィジカルAI（淹れるロボット）
        adopted: true
        why: 注文が重なっても同じ味を安定して出せる
      - name: master-brews
        label: マスターが手で淹れる
        why_not: 注文が重なるとマスターが接客や豆の見極めに手が回らない
      - name: robot-with-master-exception
        label: 通常はロボット特別な注文だけマスター
        why_not: 特別な注文の線引きが曖昧で、ロボットとマスターのどちらが動くかが客に分かりにくくなる
    affects:
      - ordering
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D14
    topic: 量り売りの豆を量って詰める担当
    chosen: robot-weighs-and-packs
    options:
      - name: robot-weighs-and-packs
        label: ロボットが量って詰める
        adopted: true
        why: 量の誤差が出にくく、客を待たせずに渡せる
      - name: master-weighs
        label: マスターが対面で量る
        why_not: 対面で量る時間がマスターの手を止める
      - name: customer-self-weighs
        label: 客がセルフで量る
        why_not: 量の誤差や衛生面が客任せになる
    affects:
      - retail
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D15
    topic: 生豆が切れそうなときの補充発注
    chosen: auto-reorder-on-low-stock
    options:
      - name: auto-reorder-on-low-stock
        label: 在庫が減ったら店のAIが自動で発注する
        adopted: true
        why: 生豆切れで焙煎が止まるのを防ぎ、発注のたびにマスターの手を煩わせない
      - name: propose-and-approve
        label: AIが提案しマスターが承認してから発注する
        why_not: 承認が遅れると入荷が遅れ、生豆が切れる恐れがある
      - name: master-reorders
        label: マスターが自分で見て発注する
        why_not: 在庫の確認と発注の見落としが、そのまま生豆切れになる
    affects:
      - sourcing
      - GreenBeansLot
      - AutoReorderGreenBeansOnLowStock
    note: ユーザー依頼による。自動補充の対象は、マスターが選んだことのある豆に限る（Q3の回答で確定）。新しい豆の発注は従来どおりマスターが選ぶ（D3）。理由づけはAIが補った仮置き
  - id: D16
    topic: 支払いに失敗したときの対応
    chosen: robot-guides-alternative-payment
    options:
      - name: robot-guides-alternative-payment
        label: ロボットが客に声をかけ別の支払い方法を案内する
        adopted: true
        why: 客を気まずくさせず、その場で支払いを済ませてドリンクを渡せる
      - name: hold-until-paid
        label: 何も案内せず、支払いが済むまで淹れずに待つ
        why_not: 客は何が起きたか分からず、その場で立ち尽くす
      - name: serve-and-bill-later
        label: 淹れて渡し後で請求する
        why_not: 取りはぐれの恐れが残る
    affects:
      - ordering
      - Order
      - GuideAlternativePaymentOnFailure
    note: 選択肢は回答者が選んだもの。理由づけはAIが補った仮置きで、回答者に未確認
  - id: D17
    topic: 機器の停止を検知したときの最初の連絡先
    chosen: notify-customer-with-alternative
    options:
      - name: notify-customer-with-alternative
        label: 客に状況を伝え代わりの対応を案内する
        adopted: true
        why: 待たされる客に先に状況を伝えることで不安を和らげられる
      - name: notify-master-manual-switch
        label: マスターに通知して手動運転に切り替えてもらう
        why_not: 回答者は選ばなかった（理由は未確認）
      - name: notify-both
        label: マスターと客の両方に伝える
        why_not: 回答者は選ばなかった（理由は未確認）
    affects:
      - operations
      - NotifyCustomerOnOutage
    note: 理由づけはAIが補った仮置き。マスターへの切り替えはD30で確定（マスターが目で見て気づく）
  - id: D18
    topic: この店の強み（作り込む部分）
    chosen: craft-and-physical-ai-fusion
    options:
      - name: craft-and-physical-ai-fusion
        label: 手職人とフィジカルAIの融合（メカメカしさと温かみ）
        adopted: true
        why: '回答者の言葉: メカメカしいのと昔ながらの手職人の融合でフィジカルAIなのに温かみがある'
      - name: master-eye-beans
        label: マスターの目で選ぶ生豆と焙煎のこだわり
        why_not: 回答者は選ばなかった（理由は未確認）
      - name: subscription
        label: 豆の定期便
        why_not: 回答者は選ばなかった（理由は未確認）
      - name: virtual-character-reception
        label: バーチャルキャラの接客体験
        why_not: 回答者は強みに挙げず、バーチャル接客を削るとした（D19）
    affects:
      - roasting
      - ordering
    note: 選択肢にない自由記述での回答。サブドメイン分類（どこをCOREとするか）は次の質問で確認
  - id: D19
    topic: バーチャル接客を削ったあと接客を誰が担うか
    chosen: physical-ai-receives
    options:
