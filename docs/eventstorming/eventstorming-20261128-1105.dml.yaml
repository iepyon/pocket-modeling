    dn: []
    description: "**境界の理由**: 豆の定期便の契約（申し込み、休止、再開、解約）と毎月の発送の言葉の範囲。\n- マスターが毎月の豆を選び、詰めロボットが詰め、発送は外部の配送業者が行う\n- 発送するときまでに焙煎から3日以内の豆だけを詰める\n"
  - name: operations
