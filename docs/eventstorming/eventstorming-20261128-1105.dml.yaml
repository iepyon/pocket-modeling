      actors:
        ShopAgent: 店のAIエージェント
        Master: マスター
      cmds:
        DetectOutage: 機器の停止を検知する
        NotifyCustomerOfOutage: 停止を客に伝える
        SwitchToManualOperation: 手動運転に切り替える
        RestoreAutomaticOperation: 自動運転に戻す
      evts:
        OutageDetected: 機器の停止が検知された
        CustomerNotifiedOfOutage: 停止が客に伝えられた
        ManualOperationStarted: 手動運転が始まった
        AutomaticOperationRestored: 自動運転に戻った
      pols:
        NotifyCustomerOnOutage: 停止を検知したら客に伝えて代わりの対応を案内する
    sub: supporting-operations
    up: []
    dn: []
    description: "**境界の理由**: 店の運用監視。機器の停止の検知と客への案内、手動運転への切り替えの言葉の範囲。\n- 店のAIエージェントが停止を検知し、客に状況を伝える\n- 手動運転への切り替えはマスターが目で見て気づいて行う\n"
policies:
  - name: AutoInstructRoastingOnLowStock
    ctx: roasting
    trg: RoastedStockLow
    cmd: RoastBeans
    evt: BeansRoasted
    agg: RoastBatch
  - name: AutoReorderGreenBeansOnLowStock
    ctx: sourcing
    trg: GreenBeansStockLow
    cmd: PlaceGreenBeansOrder
    evt: GreenBeansOrdered
    note: 対象はマスターが選んだことのある豆に限る（D15）
    agg: GreenBeansLot
  - name: GuideAlternativePaymentOnFailure
    ctx: ordering
    trg: PaymentFailed
    cmd: GuideAlternativePayment
    evt: AlternativePaymentGuided
  - name: NotifyCustomerOnOutage
    ctx: operations
    trg: OutageDetected
    cmd: NotifyCustomerOfOutage
    evt: CustomerNotifiedOfOutage
  - name: InquireSupplierOnDiscrepancy
    ctx: sourcing
    trg: DiscrepancyDetected
    cmd: InquireSupplierDiscrepancy
    evt: SupplierInquirySent
    agg: GreenBeansLot
  - name: RefundOnPaidOrderCancellation
    ctx: ordering
    trg: OrderCancelled
    cmd: RefundPayment
    evt: PaymentRefunded
    agg: Order
    note: 支払い済みの注文を取り消したときだけ返金する
domains:
  - name: coffee-shop
    vision: フィジカルAIと手職人の融合で、豆にこだわる店を温かみのある形で切り盛りする
    subs:
      - name: roasting-craft
        type: CORE_SUBDOMAIN
        vision: 生豆を焙いて合否を判定する。手職人の目と舌をフィジカルAIに結びつける、店の強みの中心
      - name: bean-retail-craft
        type: CORE_SUBDOMAIN
        vision: 焙煎した豆を袋詰めし手書きのメッセージを添えて渡す。温かみが残る場面
      - name: supporting-operations
        type: SUPPORTING_SUBDOMAIN
        vision: 仕入れ・注文と接客・定期便・店の運用監視。店を回すために必要だが、強みの中心ではない
aggregates:
  - name: RoastBatch
    ctx: roasting
    purpose: 焙煎の1回分を一つのまとまりとして扱い、焙煎した日時・測定値・合否を記録して、焙煎から客に渡すまで追えるようにする。
    background: 豆にこだわる店なので、どの生豆をいつ焙煎し、どう合否が決まったかを辿れることが品質と鮮度の保証になる。焙煎から3日以内の判定は、焙煎日時から計算するリードモデル（FreshRoastedBeansForSale）で、詰める側が行う。
    constraints:
      - 焙煎の日時は必ず記録する
      - 合否が決まるまで客に渡さない
      - 不合格になった豆は廃棄する
    states:
      - ROASTED
      - FLAGGED_FOR_TASTING
      - APPROVED
      - REJECTED
      - DISCARDED
    terminalStates:
      - APPROVED
      - DISCARDED
    transitions:
      - from: ROASTED
        to: APPROVED
        via: MeasureRoast
        when: 測定値が基準内
      - from: ROASTED
        to: FLAGGED_FOR_TASTING
        via: MeasureRoast
        when: 測定値が基準外
      - from: FLAGGED_FOR_TASTING
        to: APPROVED
        via: TasteFlaggedRoast
        when: マスターが合格と判断
      - from: FLAGGED_FOR_TASTING
        to: REJECTED
        via: TasteFlaggedRoast
        when: マスターが不合格と判断
      - from: REJECTED
        to: DISCARDED
        via: DiscardRoast
    attrs:
      - name: roastBatchId
        type: string
        required: true
        note: 焙煎ロット番号。詰め・配送側がこの番号を持つことで、客に渡すまで追える
      - name: beanType
        type: string
        required: true
      - name: roastedAt
        type: datetime
        required: true
        note: 焙煎から3日以内の判定に使う
      - name: measurement
        type: string
        required: false
      - name: tasteVerdict
        type: string
        required: false
    events:
      - name: BeansRoasted
        params:
          - name: roastBatchId
            type: string
            required: true
          - name: beanType
            type: string
            required: true
          - name: roastedAt
            type: datetime
            required: true
      - name: RoastApproved
        params:
          - name: roastBatchId
            type: string
            required: true
      - name: RoastFlaggedForTasting
        params:
          - name: roastBatchId
            type: string
            required: true
      - name: RoastApprovedByMaster
        params:
          - name: roastBatchId
            type: string
            required: true
      - name: RoastRejected
        params:
          - name: roastBatchId
            type: string
            required: true
      - name: RoastDiscarded
        params:
          - name: roastBatchId
            type: string
            required: true
        terminal: true
    note: 客に渡すまでの追跡は、BCをまたぐため、詰め・配送側が焙煎ロット番号を持つことで実現する（D32）
  - name: GreenBeansLot
    ctx: sourcing
    purpose: 生豆の入荷1回分を一つのまとまりとして扱い、発注から入荷、伝票との照合までを記録して、どの入荷の生豆かを追えるようにする。
    background: 生豆の在庫は入荷ごとに数えると決めた。伝票と合わない入荷の問い合わせや、豆の鮮度の管理を、入荷の単位で行うため。
    constraints:
      - 入荷の日付と数量は必ず記録する
      - 伝票と合わない入荷は在庫に加えず仕入れ先に問い合わせる
      - 自動補充の対象はマスターが選んだことのある豆に限る
    states:
      - ORDERED
      - RECEIVED
      - DISCREPANCY_REPORTED
    terminalStates:
      - RECEIVED
    transitions:
      - from: ORDERED
        to: RECEIVED
        via: ReceiveGreenBeans
        when: 伝票と一致
      - from: ORDERED
        to: DISCREPANCY_REPORTED
        via: InquireSupplierDiscrepancy
        when: 伝票と不一致
      - from: DISCREPANCY_REPORTED
        to: RECEIVED
        via: ReceiveGreenBeans
        when: 仕入れ先との確認が済んだ
    attrs:
      - name: greenBeansLotId
        type: string
        required: true
      - name: beanType
        type: string
        required: true
      - name: receivedAt
        type: datetime
        required: false
      - name: quantity
        type: number
        required: true
    events:
      - name: GreenBeansOrdered
        params:
          - name: greenBeansLotId
            type: string
            required: true
          - name: beanType
            type: string
            required: true
          - name: quantity
            type: number
            required: true
      - name: GreenBeansReceived
        params:
          - name: greenBeansLotId
            type: string
            required: true
          - name: receivedAt
            type: datetime
            required: true
        terminal: true
      - name: SupplierInquirySent
        params:
          - name: greenBeansLotId
            type: string
            required: true
      - name: DiscrepancyDetected
        params:
          - name: greenBeansLotId
            type: string
            required: true
  - name: Subscription
    ctx: subscription
    purpose: 客ごとの豆の定期便を一つの契約として扱い、申し込みから休止・再開・解約、毎月の豆選びと発送までの状態を管理する。
    background: 定期便は、焙煎から発送までの鮮度の線引き（発送時点で焙煎から3日以内）と、マスターが毎月豆を選ぶ温かみの両方を守る必要がある。客はいつでも、次の発送前なら休止や解約ができる。
    constraints:
      - 次の発送前なら休止・解約を受け付ける
      - 発送時点で焙煎から3日以内の豆だけを詰める
      - 今月の豆はマスターが選ぶ
    states:
      - ACTIVE
      - PAUSED
      - CANCELLED
      - PACKING
    terminalStates:
      - CANCELLED
    transitions:
      - from: ACTIVE
        to: PAUSED
        via: PauseSubscription
        when: 客が次の発送前に休止を申し出た
      - from: PAUSED
        to: ACTIVE
        via: ResumeSubscription
        when: 客が再開を申し出た
      - from: ACTIVE
        to: CANCELLED
        via: CancelSubscription
        when: 客が次の発送前に解約を申し出た
      - from: PAUSED
        to: CANCELLED
        via: CancelSubscription
        when: 客が解約を申し出た
      - from: ACTIVE
        to: PACKING
        via: PackSubscriptionBeans
        when: 今月の発送の詰めを始めた
      - from: PACKING
        to: ACTIVE
        via: DeliverSubscriptionBeans
        when: 配送業者が客に届けた
    attrs:
      - name: subscriptionId
        type: string
        required: true
      - name: customerId
        type: string
        required: true
    events:
      - name: SubscriptionStarted
        params:
          - name: subscriptionId
            type: string
            required: true
          - name: customerId
            type: string
            required: true
      - name: SubscriptionPaused
        params:
          - name: subscriptionId
            type: string
            required: true
      - name: SubscriptionResumed
        params:
          - name: subscriptionId
            type: string
            required: true
      - name: SubscriptionCancelled
        params:
          - name: subscriptionId
            type: string
            required: true
        terminal: true
      - name: MonthlyBeansSelected
        params:
          - name: subscriptionId
            type: string
            required: true
      - name: SubscriptionBeansPacked
        params:
          - name: subscriptionId
            type: string
            required: true
      - name: SubscriptionBeansDelivered
        params:
          - name: subscriptionId
            type: string
            required: true
      - name: SubscriptionMessageWritten
        params:
          - name: subscriptionId
            type: string
            required: true
  - name: Order
    ctx: ordering
    purpose: 店内で飲むドリンクの注文1件を一つのまとまりとして扱い、注文から支払い、淹れる、最後の一手までの状態を管理する。
    background: 客のアプリやAIが自動で支払い、ドリンクを淹れるのはロボット、最後の一手はマスター（忙しいときは省略）と決めた。淹れ始める前なら、客は変更や取り消しができる。
    constraints:
      - 支払いが済むまでドリンクは淹れない
      - 淹れ始めたあとは取り消せない
      - 最後の一手はマスターが忙しいとき省略してよい
    states:
      - PLACED
      - PAID
      - PAYMENT_FAILED
      - BREWED
      - FINISHED
      - CANCELLED
    terminalStates:
      - FINISHED
      - CANCELLED
    transitions:
      - from: PLACED
        to: PAID
        via: Pay
        when: 支払いに成功
      - from: PLACED
        to: PAYMENT_FAILED
        via: Pay
        when: 支払いに失敗
      - from: PAYMENT_FAILED
        to: PAID
        via: Pay
        when: 別の支払い方法で成功
      - from: PAID
        to: BREWED
        via: BrewDrink
      - from: BREWED
        to: FINISHED
        via: FinishDrink
        when: マスターが最後の一手を加えた
      - from: PLACED
        to: CANCELLED
        via: CancelOrder
      - from: PAYMENT_FAILED
        to: CANCELLED
        via: CancelOrder
      - from: PAID
        to: CANCELLED
        via: CancelOrder
        when: 淹れ始める前
      - from: PAYMENT_FAILED
        to: CANCELLED
        via: CancelAbandonedOrder
        when: 支払いに失敗したまま10分が過ぎた
    attrs:
      - name: orderId
        type: string
        required: true
      - name: customerId
        type: string
        required: true
    events:
      - name: OrderPlaced
        params:
          - name: orderId
            type: string
            required: true
      - name: PaymentCompleted
        params:
          - name: orderId
            type: string
            required: true
      - name: PaymentFailed
        params:
          - name: orderId
            type: string
            required: true
      - name: DrinkBrewed
        params:
          - name: orderId
            type: string
            required: true
      - name: DrinkFinished
        params:
          - name: orderId
            type: string
            required: true
        terminal: true
      - name: OrderCancelled
        params:
          - name: orderId
            type: string
            required: true
        terminal: true
      - name: AlternativePaymentGuided
        params:
          - name: orderId
            type: string
            required: true
      - name: AbandonedOrderCancelled
        params:
          - name: orderId
            type: string
            required: true
        terminal: true
      - name: PaymentRefunded
        params:
          - name: orderId
            type: string
            required: true
  - name: CustomerPreference
    ctx: ordering
    purpose: 客の好みの記録を、客の許可の範囲で持ち、許可が取り消されたらすぐ削除する。
    background: 好みは客の許可を取って記録すると決めた。客が記録をやめてほしいと言ったときは、すぐに削除する。
    constraints:
      - 客の許可があるときだけ記録し使う
      - 許可が取り消されたらすぐ削除する
    states:
      - RECORDED
      - ERASED
    terminalStates:
      - ERASED
    transitions:
      - from: RECORDED
        to: ERASED
        via: EraseCustomerPreference
        when: 客が記録をやめてほしいと言った
    attrs:
      - name: customerId
        type: string
        required: true
      - name: preferences
        type: string
        required: true
      - name: consentGivenAt
        type: datetime
        required: true
    events:
      - name: PreferenceRecorded
        params:
          - name: customerId
            type: string
            required: true
          - name: consentGivenAt
            type: datetime
            required: true
      - name: CustomerPreferenceErased
        params:
          - name: customerId
            type: string
            required: true
        terminal: true
queries:
  - name: FreshRoastedBeansForSale
    ctx: roasting
    purpose: 客に渡してよい焙煎豆（合格かつ焙煎から3日以内）の一覧を出す。
    users: 接客ロボット・詰めロボット
    sources:
      - RoastBatch
    formula: 状態が合格で、現在の日時と焙煎日時の差が3日以内の焙煎ロットを豆ごとにまとめる
  - name: RoastedStockLevel
    ctx: roasting
    purpose: 豆ごとの焙煎済み在庫の量を出し、マスターが決めた目安と比べる。
    users: 店のAIエージェント
    sources:
      - RoastBatch
    formula: 合格した焙煎ロットの量を豆ごとに合計し、マスターが豆ごとに決めた目安と比べる
  - name: GreenBeansStockLevel
    ctx: sourcing
    purpose: 生豆の在庫の量を、豆の種類ごとに出して補充の要否を判断する。
    users: 店のAIエージェント
    sources:
      - GreenBeansLot
    formula: 入荷済みの生豆ロットの残量を豆の種類ごとに合計し、補充の目安と比べる。対象はマスターが選んだことのある豆に限る
actions:
  - id: A1
    text: AIが顧客像に沿って選んだ決定（D35〜D39）と、AIが補った理由づけを、オーナー本人が確認する
    owner: オーナー
    done: true
  - id: A2
    text: 実績がたまるまでの全数試飲で、焙煎の合否の基準データを集める計画を立てる
    owner: マスター
    done: false
  - id: A3
    text: 支払いと配送の既存サービスを選ぶ（D20）
    owner: オーナー
    done: false
  - id: A4
    text: 支払いに失敗したまま客が離れたとき、放棄とみなす時間を10分とする（D40）
    owner: オーナー
    done: true
  - id: A5
    text: 客が離れたことをどう検知するかを決める（支払い失敗から10分で注文を取り消す前提）
    owner: オーナー
    done: false
