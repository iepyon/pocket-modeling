        SubscriptionMessageWritten: 定期便に手書きのメッセージが添えられた
        SubscriptionPaused: 定期便が休止された
        SubscriptionResumed: 定期便が再開された
        SubscriptionCancelled: 定期便がやめられた
      vos:
        RoastedBeans: 焙煎豆
