<!-- ============================================================
     グリル質問パネル（Artifact 版 HTML の上部に差し込まれる）
     2 つの領域を別々に描画する:
       質問エリア  #grill        … 答えたらすぐ次の質問へ進む（モデルの反映を待たない）
       反映エリア  #grill-model  … 回答がモデルに反映されたかどうかを表示（この下がモデル本体）
     - 質問:  db `grill/current`  {questions: [...]} … Claude が ArtifactData で書く（閲覧者は読むだけ）
     - 反映:  db `grill/progress` {reflected: {<qid>: {summary, at}}} … Claude が書く
     - 回答:  db `answers/<qid>--<uid>` … 閲覧者がこのパネルから書く（choices[] ＋ 単一選択時は互換用 choice）
              「これまでの回答」から選び直すと、同じドキュメントを rev（版）と prev（前の回答）つきで上書きする
     - 通知:  回答保存後、comments.sendToClaude でこのページを見張っている Claude のセッションを起こす
     仕様は SKILL.md「Artifact 上のグリル」を参照。DML 由来の内容は一切含まない（固定スニペット）。
     ============================================================ -->
<style>
  .gr {
    --gr-ink: #263238; --gr-sub: #546E7A; --gr-line: #CFD8DC; --gr-ground: #FFFFFF;
    --gr-head: #263238; --gr-head-ink: #FFFFFF; --gr-accent: #FF8F00; --gr-accent-soft: #FFF3E0;
    --gr-pick: #E3F2FD; --gr-pick-line: #1565C0; --gr-ok: #2E7D32; --gr-warn: #B71C1C;
    margin: 18px 0 8px 0; background: var(--gr-ground); color: var(--gr-ink);
    border: 1px solid var(--gr-line); border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(38, 50, 56, 0.10); max-width: 860px;
  }
  .gr-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    padding: 10px 18px; background: var(--gr-head); color: var(--gr-head-ink);
  }
  .gr-title { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: 0.02em; }
  .gr-phase {
    font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    background: var(--gr-accent); color: #3E2723;
  }
  .gr-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .gr-q { margin: 0; font-size: 1.25rem; font-weight: 700; line-height: 1.55; text-wrap: balance; }
  .gr-why, .gr-hint { margin: 0; font-size: 0.875rem; color: var(--gr-sub); }
  .gr-hint { padding: 10px 14px; background: var(--gr-accent-soft); border-radius: 6px; color: #5D4037; white-space: pre-wrap; }
  .gr-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .gr-opt {
    font: inherit; text-align: left; cursor: pointer; min-width: 0;
    padding: 12px 14px; background: var(--gr-ground); color: var(--gr-ink);
    border: 2px solid var(--gr-line); border-radius: 8px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .gr-opt:hover { border-color: #90A4AE; }
  .gr-opt[aria-pressed="true"] { background: var(--gr-pick); border-color: var(--gr-pick-line); }
  .gr-opt-head { display: flex; gap: 8px; align-items: baseline; }
  .gr-opt-key {
    flex: none; min-width: 1.6em; text-align: center; font-weight: 700; font-size: 0.8125rem;
    padding: 0 4px; border-radius: 4px; background: #ECEFF1; color: var(--gr-sub);
  }
  .gr-opt[aria-pressed="true"] .gr-opt-key { background: var(--gr-pick-line); color: #fff; }
  .gr-opt-label { font-weight: 700; overflow-wrap: anywhere; }
  .gr-opt-desc { padding-left: calc(1.6em + 8px); }
  .gr-opt-desc { font-size: 0.8125rem; color: var(--gr-sub); }
  .gr-multi { font-size: 0.8125rem; font-weight: 700; color: var(--gr-pick-line); }
  .gr-label { font-size: 0.875rem; font-weight: 700; display: block; margin-bottom: 4px; }
  .gr-text {
    font: inherit; width: 100%; min-height: 5.2em; resize: vertical;
    padding: 10px 12px; border: 2px solid var(--gr-line); border-radius: 8px;
    background: var(--gr-ground); color: var(--gr-ink);
  }
  .gr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .gr-btn {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 10px 22px; border-radius: 8px; border: 2px solid var(--gr-head);
    background: var(--gr-head); color: var(--gr-head-ink);
  }
  .gr-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .gr-btn.gr-ghost { background: transparent; color: var(--gr-ink); border-color: var(--gr-line); font-weight: 600; }
  .gr-opt:focus-visible, .gr-btn:focus-visible, .gr-text:focus-visible { outline: 3px solid var(--gr-accent); outline-offset: 2px; }
  .gr-msg { margin: 0; font-size: 0.875rem; color: var(--gr-sub); }
  .gr-msg.gr-err { color: var(--gr-warn); }
  .gr-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .gr-step { display: flex; gap: 10px; align-items: baseline; font-size: 0.9375rem; color: var(--gr-sub); }
  .gr-step .gr-dot {
    flex: none; width: 1.5em; height: 1.5em; border-radius: 50%; align-self: center;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.8125rem; font-weight: 700; background: #ECEFF1; color: #90A4AE;
  }
  .gr-step.is-done { color: var(--gr-ink); }
  .gr-step.is-done .gr-dot { background: #C8E6C9; color: #1B5E20; }
  .gr-step.is-now { color: var(--gr-ink); font-weight: 700; }
  .gr-step.is-now .gr-dot { background: #FFE082; color: #6D4C41; animation: gr-pulse 1.4s ease-in-out infinite; }
  .gr-step.is-fail .gr-dot { background: #FFCDD2; color: var(--gr-warn); }
  @keyframes gr-pulse { 50% { box-shadow: 0 0 0 5px rgba(255, 143, 0, 0.25); } }
  @media (prefers-reduced-motion: reduce) { .gr-step.is-now .gr-dot { animation: none; } }
  .gr-mine { margin: 0; padding: 10px 14px; background: var(--gr-pick); border-radius: 6px; font-size: 0.9375rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .gr-foot { border-top: 1px solid var(--gr-line); padding: 10px 18px; font-size: 0.875rem; }
  .gr-foot summary { cursor: pointer; color: var(--gr-sub); font-weight: 600; }
  .gr-log { list-style: none; margin: 10px 0 4px 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .gr-log li { min-width: 0; overflow-wrap: anywhere; }
  .gr-log .gr-log-q { color: var(--gr-sub); }
  .gr-log .gr-log-a { font-weight: 600; white-space: pre-wrap; }
  .gr-log .gr-log-who { color: var(--gr-sub); font-size: 0.8125rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .gr-log .gr-link { font-size: 0.8125rem; color: var(--gr-pick-line); }
  .gr-tag { font-size: 0.75rem; font-weight: 700; padding: 0 8px; border-radius: 999px; background: #ECEFF1; color: var(--gr-sub); }
  .gr-redo-note { margin: 0; padding: 8px 12px; border-left: 4px solid var(--gr-pick-line); background: var(--gr-pick); font-size: 0.875rem; }
  .gr-count { margin-left: auto; font-size: 0.8125rem; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .gr-strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    padding: 8px 18px; background: #E8F5E9; color: #1B5E20; font-size: 0.875rem;
    border-top: 1px solid var(--gr-line);
  }
  .gr-strip.is-warn { background: #FFEBEE; color: var(--gr-warn); }
  .gr-strip span { min-width: 0; overflow-wrap: anywhere; flex: 1 1 16em; }
  .gr-link {
    font: inherit; font-weight: 700; cursor: pointer; padding: 2px 4px;
    background: none; border: none; color: inherit; text-decoration: underline;
  }
  .gr-link:focus-visible { outline: 3px solid var(--gr-accent); outline-offset: 2px; }
  .gm {
    margin: 22px 0 4px 0; padding: 12px 18px; max-width: 860px;
    background: #ECEFF1; color: #263238; border-radius: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .gm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .gm-title { margin: 0; font-size: 1rem; font-weight: 700; }
  .gm-state { font-size: 0.8125rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #C8E6C9; color: #1B5E20; }
  .gm-state.is-busy { background: #FFE082; color: #6D4C41; display: inline-flex; align-items: center; }
  .gm-spin {
    flex: none; display: inline-block; width: 1em; height: 1em; vertical-align: -0.15em;
    border: 2.5px solid rgba(255, 143, 0, 0.28); border-top-color: #FF8F00; border-radius: 50%;
    animation: gm-turn 0.8s linear infinite;
  }
  .gm-state .gm-spin { margin-right: 6px; border-color: rgba(109, 76, 65, 0.25); border-top-color: #6D4C41; }
  @keyframes gm-turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gm-spin { animation-duration: 2.4s; } }
  .gm-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.875rem; }
  .gm-list li { display: flex; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
  .gm-list .gm-mark { flex: none; font-weight: 700; color: #1B5E20; }
  .gm-list li.is-wait { color: #546E7A; }
  .gm-list li.is-wait { align-items: center; }
  .gm-list .gm-age { color: #78909C; font-size: 0.8125rem; white-space: nowrap; }
  .gm-late { margin: 0; padding: 8px 12px; border-radius: 6px; background: #FFF8E1; color: #5D4037; font-size: 0.875rem; }
  .gm-late .gr-link { color: #5D4037; }
</style>

<section class="gr" id="grill">
  <div class="gr-head">
    <p class="gr-title" role="heading" aria-level="2">Claude からの質問</p>
    <span class="gr-phase" id="grill-phase" hidden></span>
    <span class="gr-count" id="grill-count" hidden></span>
  </div>
  <div class="gr-body" id="grill-body" aria-live="polite">
    <p class="gr-msg">質問を読み込んでいます…</p>
  </div>
  <div class="gr-strip" id="grill-strip" hidden></div>
  <details class="gr-foot" id="grill-foot" hidden>
    <summary id="grill-foot-sum">これまでの回答</summary>
    <ul class="gr-log" id="grill-log"></ul>
  </details>
</section>

<section class="gm" id="grill-model" hidden aria-live="polite">
  <div class="gm-row">
    <p class="gm-title" role="heading" aria-level="2">モデルへの反映</p>
    <span class="gm-state" id="grill-model-state"></span>
  </div>
  <ul class="gm-list" id="grill-model-list"></ul>
</section>

<script>
(function () {
  var root = document.getElementById('grill');
  var modelBox = document.getElementById('grill-model');
  if (!root) return;
  // ローカルで開いた HTML（claude.ai の外）ではパネルごと出さない
  if (!window.claude || typeof window.claude.use !== 'function') { root.hidden = true; return; }

  var THREAD_KEY = 'grill-thread';
  var body = document.getElementById('grill-body');
  var phaseEl = document.getElementById('grill-phase');
  var countEl = document.getElementById('grill-count');
  var strip = document.getElementById('grill-strip');
  var foot = document.getElementById('grill-foot');
  var footSum = document.getElementById('grill-foot-sum');
  var logEl = document.getElementById('grill-log');
  var modelState = document.getElementById('grill-model-state');
  var modelList = document.getElementById('grill-model-list');

  var S = {
    db: null, user: null, uid: null, canWrite: true,
    board: null, boardLoaded: false, reflected: {}, answers: [], names: {},
    sel: [], redo: '', redoQ: null, busy: false, formErr: '',
    last: null,          // 直前に送った回答 {qid, line}
    notify: '',          // '' | 'sending' | 'ok' | {code, detail}
    notifiedAt: 0, unavailable: '', stale: false, viewKey: ''
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  }
  function str(v) { return typeof v === 'string' ? v : ''; }

  function questions() {
    var b = S.board;
    if (!b) return [];
    var list = Array.isArray(b.questions) ? b.questions : (str(b.qid) ? [b] : []);
    return list.filter(function (q) { return q && str(q.qid) && str(q.text); });
  }
  function mine(qid) {
    for (var i = 0; i < S.answers.length; i++) {
      var a = S.answers[i];
      if (a.qid === qid && a.by === S.uid) return a;
    }
    return null;
  }
  function current() {
    var qs = questions();
    for (var i = 0; i < qs.length; i++) if (S.redo && qs[i].qid === S.redo) return qs[i];
    if (S.redo && S.redoQ && S.redoQ.qid === S.redo) return S.redoQ;
    for (var j = 0; j < qs.length; j++) if (!mine(qs[j].qid)) return qs[j];
    return null;
  }
  // 選び直し用の質問を組み立てる。列（grill/current）に残っていればその最新版（誤字を直した選択肢）を、
  // 外れていれば回答に残した質問文と選択肢から再現する。選択肢が復元できなければ自由記述だけで答える
  function reselectQuestion(a) {
    var qs = questions();
    for (var i = 0; i < qs.length; i++) if (qs[i].qid === a.qid) return qs[i];
    var labels = Array.isArray(a.options) ? a.options.filter(function (x) { return str(x); }) : [];
    return {
      qid: a.qid, text: str(a.question) || '（質問文が残っていません）', phase: str(a.phase),
      options: labels.map(function (l) { return { label: l }; }), multi: a.multi === true,
      reselect: true
    };
  }
  function startReselect(a) {
    S.redo = a.qid; S.redoQ = reselectQuestion(a); S.formErr = '';
    render();
    try { root.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
  }
  function cancelReselect() { S.redo = ''; S.redoQ = null; S.formErr = ''; render(); }
  function atOf(v) { var t = Date.parse(str(v)); return isNaN(t) ? 0 : t; }
  // 反映待ちか: qid が reflected に無い、または回答が反映より新しい（選び直された回答）
  function isPending(a) {
    if (!str(a.qid)) return false;
    var r = S.reflected[a.qid];
    if (!r) return true;
    var aAt = atOf(a.at), rAt = atOf(r.at);
    return !!(aAt && rAt && aAt > rAt);
  }
  function othersFor(qid) {
    return S.answers.filter(function (a) { return a.qid === qid && a.by !== S.uid; });
  }
  // 回答ドキュメントの選択を配列で返す（choices[] 優先、旧形式の choice 単一にも対応）
  function choicesOf(a) {
    if (!a) return [];
    if (Array.isArray(a.choices)) return a.choices.filter(function (c) { return str(c); });
    return str(a.choice) ? [a.choice] : [];
  }
  function keyOf(i) { return i < 26 ? String.fromCharCode(97 + i) + '.' : (i + 1) + '.'; }
  function answerLine(a) {
    if (a.hint) return '？（ヒントがほしい）';
    var parts = [];
    var cs = choicesOf(a);
    if (cs.length) parts.push(cs.join('、'));
    if (str(a.text)) parts.push(a.text);
    return parts.join(' ／ ') || '（空の回答）';
  }
  function nameOf(id) {
    if (id === S.uid) return 'あなた';
    return S.names[id] || 'ほかの参加者';
  }
  function pending() {
    return S.answers.filter(isPending);
  }

  // ---------- 質問エリア ----------
  function view() {
    if (S.unavailable) return 'unavailable';
    if (!S.boardLoaded) return 'loading';
    if (current()) return 'form';
    if (S.board && (S.board.done === true || S.board.status === 'done')) return 'done';
    return pending().length ? 'waiting' : 'empty';
  }

  function render() {
    var v = view();
    var q = v === 'form' ? current() : null;
    var sig = q ? JSON.stringify([q.qid, q.text, q.why, q.hint, q.phase, q.options, q.multi === true]) : str(S.board && S.board.note);
    var key = [v, sig, S.canWrite, S.stale, S.redo].join('|');
    if (key !== S.viewKey) {
      S.viewKey = key;
      body.textContent = '';
      phaseEl.hidden = !(q && str(q.phase));
      if (q && str(q.phase)) phaseEl.textContent = q.phase;
      ({ unavailable: drawUnavailable, loading: drawLoading, empty: drawEmpty,
         waiting: drawWaiting, done: drawDone, form: drawForm })[v](q);
    }
    var left = questions().filter(function (x) { return !mine(x.qid); }).length;
    countEl.hidden = !left;
    if (left) countEl.textContent = '残り ' + left + ' 問';
    drawOthers(q);
    drawStrip();
    drawLog();
    drawModel();
  }

  function drawUnavailable() { body.appendChild(el('p', 'gr-msg', S.unavailable)); }
  function drawLoading() {
    body.appendChild(el('p', 'gr-msg', S.stale
      ? 'まだデータに接続できていません。通信環境を確認してください。つながり次第、ここに質問が表示されます。'
      : '質問を読み込んでいます…'));
  }
  function drawEmpty() {
    body.appendChild(el('p', 'gr-q', 'いまは質問がありません'));
    body.appendChild(el('p', 'gr-msg', 'Claude が次の質問を用意すると、ここに表示されます。'));
  }
  function drawWaiting() {
    body.appendChild(el('p', 'gr-q', 'いま出ている質問には、すべて答えました'));
    body.appendChild(el('p', 'gr-msg', 'Claude が回答を読んで、次の質問を用意しています。用意できると、ここに自動で表示されます。'));
  }
  function drawDone() {
    body.appendChild(el('p', 'gr-q', '質問はここまでです'));
    body.appendChild(el('p', 'gr-msg', str(S.board.note) || 'おつかれさまでした。回答がすべて反映されると、下のモデルが最新の状態になります。'));
  }

  function drawForm(q) {
    body.appendChild(el('p', 'gr-q', q.text));
    if (str(q.why)) body.appendChild(el('p', 'gr-why', 'なぜ聞くか：' + q.why));
    if (str(q.hint)) body.appendChild(el('p', 'gr-hint', q.hint));
    if (!S.canWrite) {
      body.appendChild(el('p', 'gr-msg', 'このページは閲覧専用で開かれています。回答するには、共有元の方に「コントリビューター」以上の権限をもらってください。'));
      body.appendChild(el('div')).id = 'grill-others';
      return;
    }
    var prev = mine(q.qid);   // やり直し・選び直しのときだけ存在する
    if (prev && S.redo === q.qid) {
      body.appendChild(el('p', 'gr-redo-note', '選び直しています。前の回答：' + answerLine(prev) +
        (S.reflected[q.qid] ? '（モデルに反映済み。送ると、Claude が反映をやり直します）' : '')));
      if (q.reselect && !(Array.isArray(q.options) && q.options.length)) {
        body.appendChild(el('p', 'gr-msg', 'この質問の選択肢は残っていないので、自分の言葉で答えてください。'));
      }
    }
    var opts = Array.isArray(q.options) ? q.options : [];
    var multi = q.multi === true;
    S.sel = choicesOf(prev);   // 選択中ラベルの配列（単一選択なら高々 1 件）

    if (opts.length) {
      if (multi) body.appendChild(el('p', 'gr-multi', '当てはまるものをすべて選べます（複数選択可）'));
      var grid = el('div', 'gr-opts');
      var btns = [];
      var n = 0;
      opts.forEach(function (o) {
        var label = str(o && o.label);
        if (!label) return;
        var b = el('button', 'gr-opt');
        b.type = 'button';
        b.id = 'grill-opt-' + n;
        b.setAttribute('aria-pressed', String(S.sel.indexOf(label) >= 0));
        var head = el('span', 'gr-opt-head');
        head.appendChild(el('span', 'gr-opt-key', keyOf(n)));
        head.appendChild(el('span', 'gr-opt-label', label));
        b.appendChild(head);
        if (str(o.desc)) b.appendChild(el('span', 'gr-opt-desc', o.desc));
        btns.push({ b: b, label: label });
        n++;
        b.addEventListener('click', function () {
          var at = S.sel.indexOf(label);
          if (multi) { if (at >= 0) S.sel.splice(at, 1); else S.sel.push(label); }
          else S.sel = at >= 0 ? [] : [label];
          btns.forEach(function (x) { x.b.setAttribute('aria-pressed', String(S.sel.indexOf(x.label) >= 0)); });
        });
        grid.appendChild(b);
      });
      body.appendChild(grid);
    }

    var wrap = el('div');
    var lab = el('label', 'gr-label', opts.length ? '自分の言葉で答える・補足する（任意）。a. b. … の記号で答えても構いません（例「a と c、ただし…」）' : 'あなたの答え');
    lab.htmlFor = 'grill-text';
    var ta = el('textarea', 'gr-text');
    ta.id = 'grill-text';
    ta.placeholder = opts.length ? '例：「a と c、ただし繁忙期は…」。現場の言葉のままで大丈夫です。' : '現場の言葉のままで大丈夫です。例外や迷いもそのまま書いてください。';
    if (prev && str(prev.text) && !prev.hint) ta.value = prev.text;
    wrap.appendChild(lab); wrap.appendChild(ta);
    body.appendChild(wrap);

    var row = el('div', 'gr-row');
    var send = el('button', 'gr-btn', '回答して次へ');
    send.type = 'button'; send.id = 'grill-send';
    var hint = el('button', 'gr-btn gr-ghost', '？ 考え方のヒントがほしい');
    hint.type = 'button'; hint.id = 'grill-hint';
    send.addEventListener('click', function () {
      var text = ta.value.trim();
      if (!S.sel.length && !text) { showFormErr('選択肢を選ぶか、答えを書いてから送ってください。'); return; }
      submit(q, { choices: S.sel.slice(), text: text, hint: false }, [send, hint]);
    });
    hint.addEventListener('click', function () {
      submit(q, { choices: [], text: ta.value.trim(), hint: true }, [send, hint]);
    });
    row.appendChild(send); row.appendChild(hint);
    if (prev && S.redo === q.qid) {
      var cancel = el('button', 'gr-btn gr-ghost', '選び直しをやめる');
      cancel.type = 'button'; cancel.id = 'grill-cancel-redo';
      cancel.addEventListener('click', cancelReselect);
      row.appendChild(cancel);
    }
    body.appendChild(row);
    var err = el('p', 'gr-msg gr-err', S.formErr);
    err.id = 'grill-err'; err.hidden = !S.formErr;
    body.appendChild(err);
    body.appendChild(el('div')).id = 'grill-others';
  }
  function showFormErr(msg) {
    S.formErr = msg;
    var e = document.getElementById('grill-err');
    if (e) { e.textContent = msg; e.hidden = !msg; }
  }

  function drawOthers(q) {
    var box = document.getElementById('grill-others');
    if (!box) return;
    box.textContent = '';
    if (!q) return;
    var list = othersFor(q.qid);
    if (!list.length) return;
    box.appendChild(el('p', 'gr-msg', 'この質問へのほかの人の回答（' + list.length + ' 件）'));
    var ul = el('ul', 'gr-log');
    list.forEach(function (a) {
      var li = el('li');
      li.appendChild(el('div', 'gr-log-a', answerLine(a)));
      li.appendChild(el('div', 'gr-log-who', nameOf(a.by)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  // 直前の回答の送信結果（質問は待たずに次へ進むので、結果は帯で伝える）
  var CHAT = 'Claude のチャットで「回答した」と送ると反映されます。';
  function notifyText(code) {
    switch (code) {
      case 'consent_required':
        return 'このページがあなたの名前でコメントを送ることが、まだ許可されていません。「Claude に知らせる」を押して許可するか、' + CHAT;
      case 'writers_only': case 'forbidden':
        return 'Claude に自動で知らせられるのは、このページの編集者だけです。進行役の方に「回答した」と伝えてください。';
      case 'no_session': case 'claude_unavailable':
        return 'いま回答を受け取れる Claude のセッションがありません。' + CHAT;
      case 'no_comments': case 'off': case 'not_granted': case 'capability_disabled': case 'capability_removed':
        return 'この画面からは Claude に自動で知らせられません。' + CHAT;
      default:
        return '一時的に Claude に知らせられませんでした。「Claude に知らせる」を押すか、' + CHAT;
    }
  }
  function link(text, id, fn) {
    var b = el('button', 'gr-link', text);
    b.type = 'button'; b.id = id;
    b.addEventListener('click', fn);
    return b;
  }
  function drawStrip() {
    var n = S.notify;
    var failed = n && typeof n === 'object';
    strip.textContent = '';
    strip.hidden = !S.last;
    if (!S.last) return;
    strip.className = 'gr-strip' + (failed ? ' is-warn' : '');
    var msg = S.last.prevLine
      ? '✓ 選び直しを保存しました：' + S.last.prevLine + ' → ' + S.last.line + '。モデルへの反映をやり直します。'
      : '✓ 回答を保存しました：' + S.last.line;
    if (n === 'sending') msg += '　Claude に知らせています…';
    else if (n === 'ok') msg += '　Claude に知らせました。';
    else if (failed) msg = '回答は保存しましたが、' + notifyText(n.code) + '（理由コード: ' + n.code + (n.detail ? ' / ' + n.detail : '') + '）';
    strip.appendChild(el('span', '', msg));
    if (failed) strip.appendChild(link('Claude に知らせる', 'grill-notify', notifyClaude));
    var qid = S.last.qid;
    var stillAsked = questions().some(function (q) { return q.qid === qid; });
    if (S.canWrite && stillAsked && !S.reflected[qid] && S.redo !== qid) {
      strip.appendChild(link('この回答をやり直す', 'grill-redo', function () { S.redo = qid; S.redoQ = null; S.formErr = ''; render(); }));
    }
  }

  function drawLog() {
    var list = S.answers.filter(function (a) { return !a.hint; });
    foot.hidden = !list.length;
    if (!list.length) return;
    footSum.textContent = 'これまでの回答（' + list.length + ' 件）';
    logEl.textContent = '';
    list.forEach(function (a, i) {
      var li = el('li');
      li.appendChild(el('div', 'gr-log-q', 'Q. ' + (str(a.question) || '（質問文なし）')));
      li.appendChild(el('div', 'gr-log-a', 'A. ' + answerLine(a)));
      var who = el('div', 'gr-log-who');
      who.appendChild(el('span', '', nameOf(a.by) + (isPending(a) ? '・反映待ち' : '・モデルに反映済み')));
      var rec = S.reflected[a.qid];
      var ds = rec && Array.isArray(rec.decisions) ? rec.decisions.filter(function (d) { return str(d); }) : [];
      if (ds.length) who.appendChild(el('span', 'gr-tag', '元になった決定: ' + ds.join('・')));
      if (typeof a.rev === 'number' && a.rev > 1) who.appendChild(el('span', 'gr-tag', '選び直し済み（' + a.rev + ' 回目）'));
      if (S.canWrite && a.by === S.uid && !S.busy) {
        who.appendChild(link('選び直す', 'grill-reselect-' + i, function () { startReselect(a); }));
      }
      li.appendChild(who);
      logEl.appendChild(li);
    });
  }

  // ---------- 反映エリア（質問エリアとは別に描く） ----------
  var LATE_MS = 5 * 60 * 1000;   // これを超えて反映待ちなら「Claude が起きていないかも」と案内する
  function ageText(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 1) return 'たったいま届いた';
    if (m < 60) return m + ' 分前に届いた';
    return Math.floor(m / 60) + ' 時間前に届いた';
  }
  function drawModel() {
    if (!S.boardLoaded) { modelBox.hidden = true; return; }
    var wait = pending().filter(function (a) { return !a.hint; });
    var done = [];
    Object.keys(S.reflected).forEach(function (qid) {
      var r = S.reflected[qid];
      if (r && str(r.summary)) done.push({ at: str(r.at), summary: r.summary });
    });
    done.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    modelBox.hidden = !(wait.length || done.length);
    if (modelBox.hidden) return;
    modelState.className = 'gm-state' + (wait.length ? ' is-busy' : '');
    modelState.textContent = '';
    if (wait.length) {
      var sp = el('span', 'gm-spin'); sp.setAttribute('aria-hidden', 'true');
      modelState.appendChild(sp);
      modelState.appendChild(el('span', '', '反映中（' + wait.length + ' 件）'));
    } else {
      modelState.textContent = 'すべて反映済み';
    }
    modelList.textContent = '';
    var oldLate = modelBox.querySelector('.gm-late');
    if (oldLate) oldLate.remove();
    var now = Date.now();
    var oldest = 0;
    wait.forEach(function (a) { var t = atOf(a.at); if (t && (!oldest || t < oldest)) oldest = t; });
    wait.slice(0, 3).forEach(function (a) {
      var li = el('li', 'is-wait');
      var s2 = el('span', 'gm-spin'); s2.setAttribute('aria-hidden', 'true');
      li.appendChild(s2);
      li.appendChild(el('span', '', '「' + answerLine(a) + '」を下のモデルに反映しています'));
      var t = atOf(a.at);
      if (t) li.appendChild(el('span', 'gm-age', ageText(now - t)));
      modelList.appendChild(li);
    });
    if (oldest && now - oldest > LATE_MS) {
      var late = el('p', 'gm-late', '届いてから ' + ageText(now - oldest).replace('前に届いた', '') +
        'たっても反映が始まっていません。Claude が起きていないかもしれません。進行役の方に「回答した」と伝えてください。');
      if (S.canWrite && S.notify !== 'sending') {
        late.appendChild(document.createTextNode(' '));
        late.appendChild(link('Claude にもう一度知らせる', 'grill-renotify', function () { S.notifiedAt = 0; notifyClaude(); }));
      }
      modelBox.appendChild(late);
    }
    done.slice(0, 3).forEach(function (r) {
      var li = el('li');
      li.appendChild(el('span', 'gm-mark', '✓'));
      li.appendChild(el('span', '', r.summary));
      modelList.appendChild(li);
    });
  }

  // ---------- 書き込み・通知 ----------
  function submit(q, ans, buttons) {
    if (S.busy) return;
    S.busy = true; showFormErr('');
    buttons.forEach(function (b) { b.disabled = true; });
    var before = mine(q.qid);
    var doc = {
      qid: q.qid, by: S.uid, choices: ans.choices,
      choice: ans.choices.length === 1 ? ans.choices[0] : '',   // 旧形式との互換（単一選択のときだけ）
      text: ans.text, hint: ans.hint,
      question: str(q.text), phase: str(q.phase), at: new Date().toISOString(),
      // 選び直しで質問が列から外れていても再現できるよう、選択肢のラベルも残す
      options: (Array.isArray(q.options) ? q.options : []).map(function (o) { return str(o && o.label); }).filter(Boolean),
      multi: q.multi === true
    };
    if (before) {
      // 選び直し・やり直し: 版を上げ、前の回答を 1 つだけ畳み込む（ドキュメントは増やさない）
      doc.rev = (typeof before.rev === 'number' ? before.rev : 1) + 1;
      doc.prev = { choices: choicesOf(before), text: str(before.text), hint: !!before.hint, at: str(before.at) };
    }
    S.db.collection('answers').doc(q.qid + '--' + S.uid).set(doc).then(function () {
      S.busy = false; S.redo = ''; S.redoQ = null; S.sel = [];
      // スナップショット到着を待たずに次の質問へ進む
      S.answers = S.answers.filter(function (a) { return !(a.qid === doc.qid && a.by === doc.by); });
      S.answers.unshift(doc);
      S.last = { qid: doc.qid, line: answerLine(doc), prevLine: before && !before.hint ? answerLine(before) : '' };
      // 続けて答えているあいだは通知を 1 回にまとめる（Claude は起きるたびに未反映の回答をすべて読み、
      // ターンの終わりにも未反映を確かめる）。前の通知から NOTIFY_MERGE_MS を過ぎたら改めて知らせる
      var waiting = pending().some(function (a) { return a.qid !== doc.qid; });
      if (S.notify === 'ok' && waiting && Date.now() - S.notifiedAt < NOTIFY_MERGE_MS) render();
      else notifyClaude();
    }, function (e) {
      S.busy = false;
      buttons.forEach(function (b) { b.disabled = false; });
      var code = e && e.code;
      if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') {
        S.canWrite = false; render();
      } else if (code === 'quota_exceeded') {
        showFormErr('保存できる回答数の上限に達しました。進行役の方に伝えてください。');
      } else {
        showFormErr('回答を保存できませんでした。通信環境を確認して、もう一度送ってください。');
      }
    });
  }

  var NOTIFY_MERGE_MS = 5 * 60 * 1000;
  // コメントのスレッドは 1 本を使い回す（回答のたびにスレッドを増やさない）
  function savedThread() { try { return localStorage.getItem(THREAD_KEY) || ''; } catch (e) { return ''; } }
  function saveThread(id) { try { id ? localStorage.setItem(THREAD_KEY, id) : localStorage.removeItem(THREAD_KEY); } catch (e) {} }

  function notifyClaude() {
    if (S.notify === 'sending') return;
    S.notify = 'sending'; render();
    var text = '【グリル回答】回答が届きました。未反映の回答を読んでモデルに反映し、質問を補充してください。';
    window.claude.use('comments').then(function (c) {
      if (!c || typeof c.sendToClaude !== 'function') throw { code: 'no_comments' };
      return c.canSendToClaude().then(function (can) {
        if (can !== 'available') throw { code: typeof can === 'string' ? can : 'off' };
        var tid = savedThread();
        function fresh() {
          return c.anchorFor(root).then(function (anchor) { return c.sendToClaude({ anchor: anchor, text: text }); });
        }
        if (!tid) return fresh();
        return c.sendToClaude({ threadId: tid, text: text }).catch(function (e) {
          if (e && (e.code === 'not_found' || e.code === 'invalid')) { saveThread(''); return fresh(); }
          throw e;
        });
      });
    }).then(function (r) {
      if (r && r.threadId) saveThread(r.threadId);
      S.notify = 'ok'; S.notifiedAt = Date.now(); render();
    }, function (e) {
      S.notify = { code: (e && e.code) || 'upstream_error', detail: String((e && e.message) || '').slice(0, 200) }; render();
    });
  }

  // ---------- 起動 ----------
  function loadNames() {
    if (!S.user || typeof S.user.profiles !== 'function') return;
    var ids = [];
    S.answers.forEach(function (a) {
      if (a.by && a.by !== S.uid && !(a.by in S.names) && ids.indexOf(a.by) < 0) ids.push(a.by);
    });
    if (!ids.length) return;
    ids.forEach(function (id) { S.names[id] = ''; });
    S.user.profiles(ids.slice(0, 64)).then(function (ps) {
      ids.forEach(function (id) { S.names[id] = (ps && ps[id] && ps[id].name) || ''; });
      render();
    }, function () {});
  }

  function start(db, user) {
    S.db = db; S.user = user;
    setInterval(function () { if (pending().length) render(); }, 30000);   // 経過時間の表示を進める
    var staleTimer = setTimeout(function () { S.stale = true; render(); }, 10000);
    function live() { clearTimeout(staleTimer); S.stale = false; }

    db.doc('grill/current').onSnapshot(function (snap) {
      if (!snap.metadata || !snap.metadata.fromCache) live();
      S.board = snap.exists ? (snap.data() || null) : null;
      S.boardLoaded = true;
      render();
    }, function () {
      live(); S.unavailable = '質問データを読み込めませんでした。ページを開き直してください。'; render();
    });

    db.doc('grill/progress').onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : null;
      S.reflected = (d && d.reflected && typeof d.reflected === 'object') ? d.reflected : {};
      render();
    }, function () {});

    db.collection('answers').orderBy('at', 'desc').limit(200).onSnapshot(function (snap) {
      S.answers = snap.docs.map(function (d) { return d.data() || {}; });
      loadNames(); render();
    }, function () {});
  }

  // モデル側の再公開でページが差し替わっても、質問エリアの状態（送信結果の帯）は引き継ぐ
  var hot = window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return { last: S.last, notify: S.notify === 'sending' ? 'ok' : S.notify }; }); } catch (e) {}
  function boot(saved) {
    if (saved && saved.last) { S.last = saved.last; S.notify = saved.notify || ''; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db) {
        S.unavailable = 'サインインして claude.ai で開くと、ここで Claude の質問に答えられます。';
        render(); return;
      }
      var idP = user && user.id ? user.id() : Promise.resolve(null);
      var canP = user && user.can ? user.can('data.write') : Promise.resolve(null);
      Promise.all([idP, canP]).then(function (v) {
        S.uid = v[0] || 'anon';
        if (v[1] === false || !v[0]) S.canWrite = false;
        start(db, user);
      }, function () { S.uid = 'anon'; S.canWrite = false; start(db, user); });
    });
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
